<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>NEON VOID · 星海弹幕</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #03040a; color: #cfe8f5;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: none; -webkit-tap-highlight-color: transparent;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(circle at 50% 42%, rgba(30,80,160,.20), transparent 62%),
      radial-gradient(circle at 50% 50%, #070b1a 0%, #020307 100%);
  }
  #stage {
    position: relative; overflow: hidden; background: #05060d;
    box-shadow:
      0 0 0 1px rgba(90,210,255,.22),
      0 0 60px rgba(40,140,220,.18),
      0 0 160px rgba(120,40,200,.14);
  }
  canvas { display: block; width: 100%; height: 100%; }
  .fx { position: absolute; inset: 0; pointer-events: none; }
  .scanlines {
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,.22) 0px, rgba(0,0,0,.22) 1px,
      rgba(0,0,0,0) 1px, rgba(0,0,0,0) 3px);
    opacity: .45;
  }
  .vignette {
    background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 42%, rgba(0,0,0,.60) 100%);
  }
  .glow { box-shadow: inset 0 0 90px rgba(60,180,255,.10); }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game"></canvas>
    <div class="fx glow"></div>
    <div class="fx scanlines"></div>
    <div class="fx vignette"></div>
  </div>
</div>
<script>
(() => {
'use strict';

/* ============================================================
   0. 基础设置
   ============================================================ */
const W = 360, H = 640;          // 逻辑分辨率（竖屏）
const STEP = 1 / 60;             // 固定步长
const TAU = Math.PI * 2;
const R = 2;                     // 内部放大倍数（像素更扎实）

const qs = new URLSearchParams(location.search);

const stage = document.getElementById('stage');
const cv = document.getElementById('game');
const ctx = cv.getContext('2d', { alpha: false });
cv.width = W * R;
cv.height = H * R;
ctx.setTransform(R, 0, 0, R, 0, 0);
ctx.textBaseline = 'top';

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rand = (a, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const fmt = (n, len) => String(n).padStart(len, '0');

const C = {
  cyan: '#5ef0ff', cyanDeep: '#1d9fc4', pink: '#ff4fa3', magenta: '#ff2d78',
  purple: '#b06bff', yellow: '#ffe066', orange: '#ffb347', green: '#5cffb0',
  red: '#ff5252', white: '#eafcff', dim: '#5e8ba6',
};

/* ============================================================
   1. 像素精灵
   ============================================================ */
function makeSprite(rows, map, scale) {
  const w = Math.max(...rows.map(r => r.length));
  const h = rows.length;
  const c = document.createElement('canvas');
  c.width = w * scale; c.height = h * scale;
  const g = c.getContext('2d');
  for (let y = 0; y < h; y++) {
    const row = rows[y];
    for (let x = 0; x < w; x++) {
      const ch = row[x];
      const col = ch ? map[ch] : null;
      if (!col) continue;
      g.fillStyle = col;
      g.fillRect(x * scale, y * scale, scale, scale);
    }
  }
  return c;
}
function sprite(rows, map, scale) {
  const whiteMap = {};
  for (const k in map) whiteMap[k] = '#ffffff';
  const w = Math.max(...rows.map(r => r.length));
  return {
    img: makeSprite(rows, map, scale),
    white: makeSprite(rows, whiteMap, scale),
    w: w * scale, h: rows.length * scale,
  };
}

// 玩家战机 11x12
const PLAYER_ROWS = [
  '.....1.....',
  '.....1.....',
  '....131....',
  '....141....',
  '....141....',
  '...12421...',
  '...12421...',
  '..1124211..',
  '.112242211.',
  '11222422211',
  '11233333211',
  '..5..5..5..',
];

// 敌方母舰由程序化图形绘制（见 drawBossBody）

const SPR = {
  player: sprite(PLAYER_ROWS, { '1': '#eafeff', '2': '#59c9ef', '3': '#175f85', '4': '#ffca4a', '5': '#ff8a3d' }, 2),
  drone: sprite([
    '.1...1.',
    '1111111',
    '1121211',
    '1111111',
    '.11111.',
    '.2...2.',
    '..2.2..',
  ], { '1': '#ff5c7a', '2': '#8f1c3d' }, 2),
  gunner: sprite([
    '..11111..',
    '.1111111.',
    '111111111',
    '112222211',
    '112333211',
    '112222211',
    '.1111111.',
    '..2...2..',
    '.2.....2.',
  ], { '1': '#b06bff', '2': '#5a2b9e', '3': '#ffe066' }, 2),
  spinner: sprite([
    '...111...',
    '.1111111.',
    '.1121211.',
    '111121111',
    '112121211',
    '111121111',
    '.1121211.',
    '.1111111.',
    '...111...',
  ], { '1': '#4dffc3', '2': '#0e7f63' }, 2),
  darter: sprite([
    '1.....1',
    '11...11',
    '.11.11.',
    '..111..',
    '.11111.',
    '..111..',
    '...1...',
  ], { '1': '#ffb347', '2': '#a35a13' }, 2),
};

/* ============================================================
   2. 音效（WebAudio 现场合成，无外部资源）
   ============================================================ */
const Snd = {
  ac: null, out: null, noise: null, ready: false, muted: false,
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') { try { this.ac.resume(); } catch (e) {} } return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ac = new AC();
      this.out = this.ac.createGain();
      this.out.gain.value = 0.30;
      this.out.connect(this.ac.destination);
      const sr = this.ac.sampleRate;
      const buf = this.ac.createBuffer(1, Math.floor(sr * 0.6), sr);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      this.noise = buf;
      this.ready = true;
    } catch (e) { this.ac = null; this.ready = false; }
  },
  blip(freq, dur, type, vol, to) {
    if (!this.ready || this.muted) return;
    const t = this.ac.currentTime;
    const o = this.ac.createOscillator();
    const g = this.ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(Math.max(24, to), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.out);
    o.start(t); o.stop(t + dur + 0.03);
  },
  hiss(dur, vol, f0, f1) {
    if (!this.ready || this.muted) return;
    const t = this.ac.currentTime;
    const s = this.ac.createBufferSource();
    s.buffer = this.noise;
    const f = this.ac.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(f0, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(60, f1), t + dur);
    const g = this.ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.out);
    s.start(t); s.stop(t + dur);
  },
  shoot() { this.blip(1500, 0.045, 'square', 0.028, 800); },
  hit() { this.blip(520, 0.035, 'triangle', 0.05, 320); },
  boom(power) {
    const p = power || 1;
    this.hiss(0.26 * p, 0.34 * Math.min(1, p), 2200, 110);
    this.blip(180 * (0.8 + Math.random() * 0.3), 0.28 * p, 'sine', 0.16, 38);
  },
  bigBoom() {
    this.hiss(0.9, 0.42, 3000, 60);
    this.blip(120, 0.9, 'sine', 0.2, 30);
    this.blip(70, 1.1, 'triangle', 0.12, 25);
  },
  hurt() {
    this.hiss(0.5, 0.38, 900, 90);
    this.blip(300, 0.45, 'sawtooth', 0.16, 50);
  },
  pickup() {
    this.blip(880, 0.07, 'square', 0.06, 1320);
    setTimeout(() => this.blip(1320, 0.09, 'square', 0.05, 1760), 60);
  },
  bomb() {
    this.hiss(0.7, 0.4, 400, 4000);
    this.blip(120, 0.7, 'sawtooth', 0.14, 900);
  },
  warn() {
    this.blip(440, 0.16, 'square', 0.07, 440);
    setTimeout(() => this.blip(330, 0.22, 'square', 0.07, 330), 180);
  },
};

/* ============================================================
   3. 全局状态
   ============================================================ */
const G = {
  state: 'title',        // title | playing | paused | gameover
  time: 0, score: 0, best: 0, newBest: false,
  lives: 3, bombs: 2, power: 1, graze: 0, kills: 0,
  wave: 0, waveState: 'idle', waveTimer: 1.4, grace: 0, waveElapsed: 0,
  banner: '', bannerT: 0, shake: 0, flash: 0, overT: 0,
  boss: null,
};

try { G.best = parseInt(localStorage.getItem('neonvoid.best') || '0', 10) || 0; } catch (e) { G.best = 0; }
function saveBest() { try { localStorage.setItem('neonvoid.best', String(G.best)); } catch (e) {} }

const player = {
  x: W / 2, y: H - 90, r: 3.2, alive: true, invuln: 0,
  fireCd: 0, tilt: 0, focus: false,
};

const pb = [];        // 玩家子弹
const eb = [];        // 敌方子弹
const enemies = [];
const parts = [];     // 粒子
const pickups = [];
const texts = [];     // 漂浮分数
const rings = [];     // 冲击波
const spawnQueue = [];// 编队延迟生成
const timers = [];    // 延迟特效

const stars = [];
for (let i = 0; i < 110; i++) {
  stars.push({
    x: rand(W), y: rand(H),
    z: rand(0.35, 1),
    s: Math.random() < 0.15 ? 2 : 1,
    tw: rand(TAU),
  });
}

// 背景星云（离屏缓存，缓慢下移）
const blobs = [];
(function buildBlobs() {
  const specs = [
    { x: 70, y: 120, r: 170, c: 'rgba(38,96,220,0.16)', sp: 4 },
    { x: 290, y: 380, r: 190, c: 'rgba(150,32,130,0.14)', sp: 7 },
    { x: 120, y: 560, r: 150, c: 'rgba(24,170,190,0.10)', sp: 10 },
  ];
  for (const s of specs) {
    const c = document.createElement('canvas');
    c.width = c.height = s.r * 2;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(s.r, s.r, 0, s.r, s.r, s.r);
    gr.addColorStop(0, s.c);
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, s.r * 2, s.r * 2);
    blobs.push({ img: c, x: s.x, y: s.y, r: s.r, sp: s.sp });
  }
})();

/* ============================================================
   4. 输入
   ============================================================ */
const keys = Object.create(null);
const key = (c) => !!keys[c];
const GAME_KEYS = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space',
  'ShiftLeft', 'ShiftRight', 'KeyX', 'KeyK', 'KeyP', 'Escape', 'Enter', 'KeyM'];

function onPress(code) {
  Snd.init();
  if (code === 'KeyM') { Snd.muted = !Snd.muted; return; }
  if (code === 'Enter' || code === 'Space') {
    if (G.state === 'title') startGame();
    else if (G.state === 'gameover' && G.overT > 0.8) startGame();
  }
  if (code === 'KeyP' || code === 'Escape') togglePause();
  if (code === 'KeyX' || code === 'KeyK') useBomb();
}
window.addEventListener('keydown', (e) => {
  if (GAME_KEYS.indexOf(e.code) >= 0) e.preventDefault();
  if (!keys[e.code]) onPress(e.code);
  keys[e.code] = true;
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

const pc = { active: false, id: null, sx: 0, sy: 0, tx: 0, ty: 0, px: 0, py: 0 };
const isTouch = qs.has('touch') || ('ontouchstart' in window) ||
  (navigator.maxTouchPoints !== undefined && navigator.maxTouchPoints > 0);
const BOMB_BTN = { x: W - 34, y: H - 62, r: 21 };

function toLocal(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
cv.addEventListener('pointerdown', (e) => {
  Snd.init();
  if (G.state === 'title') { startGame(); return; }
  if (G.state === 'gameover') { if (G.overT > 0.8) startGame(); return; }
  if (G.state === 'paused') { togglePause(); return; }
  const p = toLocal(e);
  if (isTouch) {
    if (dist2(p.x, p.y, BOMB_BTN.x, BOMB_BTN.y) < BOMB_BTN.r * BOMB_BTN.r * 1.4) { useBomb(); return; }
    if (p.y < 34 && Math.abs(p.x - W / 2) < 24) { togglePause(); return; }
  }
  pc.active = true; pc.id = e.pointerId;
  pc.sx = p.x; pc.sy = p.y;
  pc.px = player.x; pc.py = player.y;
  pc.tx = player.x; pc.ty = player.y;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener('pointermove', (e) => {
  if (!pc.active || e.pointerId !== pc.id) return;
  const p = toLocal(e);
  pc.tx = clamp(pc.px + (p.x - pc.sx) * 1.25, 12, W - 12);
  pc.ty = clamp(pc.py + (p.y - pc.sy) * 1.25, 34, H - 30);
});
function pointerUp(e) { if (e.pointerId === pc.id) { pc.active = false; pc.id = null; } }
cv.addEventListener('pointerup', pointerUp);
cv.addEventListener('pointercancel', pointerUp);
cv.addEventListener('contextmenu', (e) => e.preventDefault());

/* ============================================================
   5. 流程控制
   ============================================================ */
function startGame() {
  enemies.length = 0; eb.length = 0; pb.length = 0; pickups.length = 0;
  parts.length = 0; texts.length = 0; rings.length = 0; timers.length = 0;
  spawnQueue.length = 0;
  G.state = 'playing';
  G.score = 0; G.lives = 3; G.bombs = 2; G.power = 1;
  G.graze = 0; G.kills = 0; G.wave = 0;
  G.waveState = 'idle'; G.waveTimer = 1.2; G.grace = 0; G.waveElapsed = 0;
  G.banner = ''; G.bannerT = 0; G.flash = 0; G.shake = 0; G.overT = 0;
  G.boss = null;
  player.x = W / 2; player.y = H - 90;
  player.alive = true; player.invuln = 2.2; player.fireCd = 0; player.tilt = 0;
  Snd.init();
}

function gameOver() {
  G.state = 'gameover';
  G.overT = 0;
  G.shake = 16;
  if (G.score > G.best) { G.best = G.score; G.newBest = true; saveBest(); }
  else G.newBest = false;
}

function togglePause() {
  if (G.state === 'playing') { G.state = 'paused'; pc.active = false; }
  else if (G.state === 'paused') G.state = 'playing';
}

/* ============================================================
   6. 生成器
   ============================================================ */
const ENEMY_DEFS = {
  drone:   { hp: 3,  r: 9,  score: 100,  spr: 'drone' },
  gunner:  { hp: 10, r: 11, score: 260,  spr: 'gunner' },
  spinner: { hp: 13, r: 11, score: 340,  spr: 'spinner' },
  darter:  { hp: 2,  r: 8,  score: 80,   spr: 'darter' },
  boss:    { hp: 260, r: 40, score: 8000, spr: 'boss' },
};

function spawnEnemy(type, x, y, opt) {
  const d = ENEMY_DEFS[type];
  const w = Math.max(1, G.wave);
  const e = Object.assign({
    type, x, y, baseX: x, vx: 0, vy: 0,
    hp: Math.round(d.hp * (1 + (w - 1) * 0.10)), maxHp: 0,
    r: d.r, score: d.score, spr: d.spr,
    t: 0, seed: rand(TAU), amp: 0, fireT: rand(0.9, 2.0),
    targetY: 110, holdT: 0, angle: 0, lifeT: 0,
    hitFlash: 0, dead: false, entering: false, leaving: false, phase: 1, atkT: 1,
    alt: false, spin: 0, fanT: 1.2,
  }, opt || {});
  e.maxHp = e.hp;
  enemies.push(e);
  return e;
}

function ebullet(x, y, ang, spd, r, col) {
  if (eb.length > 720) return;
  eb.push({
    x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
    r: r || 4, col: col || C.pink, dead: false, grazed: false,
  });
}
function aimedShot(e, n, spread, spd, col, r) {
  const base = Math.atan2(player.y - e.y, player.x - e.x);
  for (let i = 0; i < n; i++) {
    ebullet(e.x, e.y, base + (i - (n - 1) / 2) * spread, spd, r || 4, col || C.pink);
  }
}
function ringShot(e, n, spd, offset, col, r) {
  for (let i = 0; i < n; i++) ebullet(e.x, e.y, offset + i * TAU / n, spd, r || 4, col || C.cyan);
}

/* --- 编队 --- */
function fLine() {
  const n = 5;
  for (let i = 0; i < n; i++) {
    const x = 46 + i * (W - 92) / (n - 1);
    spawnEnemy('drone', x, -26 - i * 24, { baseX: x, amp: 13, vy: 82, seed: i * 1.3 });
  }
}
function fVee() {
  const n = 5;
  for (let i = 0; i < n; i++) {
    const k = i - (n - 1) / 2;
    const x = W / 2 + k * 46;
    spawnEnemy('drone', x, -34 - Math.abs(k) * 22, { baseX: x, amp: 7, vy: 92, seed: k });
  }
}
function fSides() {
  spawnEnemy('gunner', -24, 62, { baseX: 70, targetY: 86 });
  spawnEnemy('gunner', W + 24, 62, { baseX: W - 70, targetY: 118 });
  spawnQueue.push({ t: 0.9, fn: () => { spawnEnemy('drone', W / 2 - 40, -20, { baseX: W / 2 - 40, amp: 10, vy: 90 }); } });
  spawnQueue.push({ t: 1.2, fn: () => { spawnEnemy('drone', W / 2 + 40, -20, { baseX: W / 2 + 40, amp: 10, vy: 90 }); } });
}
function fDarters() {
  const n = 4;
  for (let i = 0; i < n; i++) {
    const x = rand(40, W - 40);
    spawnQueue.push({
      t: i * 0.35, fn: () => {
        const e = spawnEnemy('darter', x, -20, { vy: 240 + G.wave * 6 });
        e.vx = clamp((player.x - x) * 0.55, -110, 110);
      },
    });
  }
}
function fSpinners() {
  spawnEnemy('spinner', W * 0.28, -30, { baseX: W * 0.28, targetY: 132 });
  spawnEnemy('spinner', W * 0.72, -60, { baseX: W * 0.72, targetY: 190 });
}
function fGunners() {
  for (let i = 0; i < 3; i++) {
    const x = 70 + i * (W - 140) / 2;
    spawnQueue.push({
      t: i * 0.25, fn: () => spawnEnemy('gunner', x, -24, { baseX: x, targetY: 72 + i * 26 }),
    });
  }
}

function startWave() {
  G.wave++;
  G.waveState = 'spawning';
  G.grace = 1.0;
  G.waveElapsed = 0;
  G.banner = 'WAVE ' + fmt(G.wave, 2);
  G.bannerT = 1.5;

  if (G.wave % 5 === 0) { spawnBoss(); return; }

  const w = G.wave;
  const pool = ['line', 'vee'];
  if (w >= 2) pool.push('sides');
  if (w >= 3) pool.push('darters');
  if (w >= 4) pool.push('spinners');
  if (w >= 6) pool.push('gunners', 'line');

  const choice = pick(pool);
  if (choice === 'line') fLine();
  else if (choice === 'vee') fVee();
  else if (choice === 'sides') fSides();
  else if (choice === 'darters') fDarters();
  else if (choice === 'spinners') fSpinners();
  else fGunners();

  // 高波数追加第二波编队
  if (w >= 7 && Math.random() < 0.6) {
    spawnQueue.push({ t: 2.4, fn: () => { if (G.waveState === 'spawning') fVee(); } });
  }
}

function spawnBoss() {
  const hp = Math.round(120 + G.wave * 16);
  const e = spawnEnemy('boss', W / 2, -80, { hp, maxHp: hp, r: 40, score: 8000 + G.wave * 400, entering: true });
  G.boss = e;
  G.banner = '!! WARNING !!';
  G.bannerT = 2.6;
  G.flash = 0.35;
  Snd.warn();
}

/* ============================================================
   7. 玩家
   ============================================================ */
function shoot() {
  const p = player, y = p.y - 12, sp = 640, lvl = G.power;
  const add = (ox, ang, dmg) => {
    const a = -Math.PI / 2 + ang;
    pb.push({ x: p.x + ox, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, dmg: dmg || 1, dead: false });
  };
  if (lvl <= 1) add(0, 0, 1.2);
  else if (lvl === 2) { add(-5, 0, 1); add(5, 0, 1); }
  else if (lvl === 3) { add(0, 0, 1); add(-7, -0.10, 1); add(7, 0.10, 1); }
  else { add(-4, 0, 1); add(4, 0, 1); add(0, 0, 1.2); add(-10, -0.19, 1); add(10, 0.19, 1); }
  Snd.shoot();
}

function updatePlayer(dt) {
  const p = player;
  if (!p.alive) return;
  p.invuln = Math.max(0, p.invuln - dt);

  let dx = 0, dy = 0;
  if (key('ArrowLeft') || key('KeyA')) dx--;
  if (key('ArrowRight') || key('KeyD')) dx++;
  if (key('ArrowUp') || key('KeyW')) dy--;
  if (key('ArrowDown') || key('KeyS')) dy++;
  p.focus = key('ShiftLeft') || key('ShiftRight');
  const spd = p.focus ? 105 : 215;

  if (dx || dy) {
    const l = Math.hypot(dx, dy);
    p.x += dx / l * spd * dt;
    p.y += dy / l * spd * dt;
  }
  if (pc.active) {
    p.x += (pc.tx - p.x) * Math.min(1, dt * 20);
    p.y += (pc.ty - p.y) * Math.min(1, dt * 20);
  }
  if (DEMO) {
    if (qs.has('hold')) { p.x = W / 2; p.y = H * 0.70; }
    else {
      p.x = W / 2 + Math.sin(G.time * 1.1) * 95;
      p.y = H * 0.74 + Math.sin(G.time * 0.73) * 42;
    }
  }
  p.x = clamp(p.x, 12, W - 12);
  p.y = clamp(p.y, 34, H - 30);
  p.tilt += (dx - p.tilt) * Math.min(1, dt * 10);

  p.fireCd -= dt;
  if (p.fireCd <= 0) { shoot(); p.fireCd = 0.08; }
}

/* ============================================================
   8. 敌人
   ============================================================ */
function updateEnemies(dt) {
  const waveSpeed = 1 + Math.min(0.6, G.wave * 0.025);
  for (const e of enemies) {
    if (e.dead) continue;
    e.t += dt;
    e.hitFlash = Math.max(0, e.hitFlash - dt * 5);

    if (e.type === 'boss') { updateBoss(e, dt); continue; }

    if (e.type === 'drone') {
      e.y += e.vy * dt;
      e.x = e.baseX + Math.sin(e.t * 2.3 + e.seed) * e.amp;
      e.fireT -= dt;
      if (e.fireT <= 0 && e.y > 6 && e.y < H * 0.72) {
        aimedShot(e, 1, 0, 100 * waveSpeed, C.pink, 4);
        e.fireT = rand(1.9, 3.0);
      }
      if (e.y > H + 30) e.dead = true;

    } else if (e.type === 'gunner') {
      if (e.leaving) {
        e.x += e.vx * dt;
        e.y += 120 * dt;
        if (e.y > H + 40) e.dead = true;
      } else {
        const gx = e.baseX - e.x, gy = e.targetY - e.y;
        if (Math.abs(gx) > 2 || Math.abs(gy) > 2) {
          const d = Math.hypot(gx, gy) || 1;
          e.x += gx / d * 115 * dt;
          e.y += gy / d * 115 * dt;
        } else {
          e.holdT += dt;
          e.x = e.baseX + Math.sin(e.t * 1.2) * 22;
          e.fireT -= dt;
          if (e.fireT <= 0) {
            aimedShot(e, 3, 0.20, 100 * waveSpeed, C.purple, 4.5);
            e.fireT = 1.9;
          }
          if (e.holdT > 7.5) e.leaving = true;
        }
      }

    } else if (e.type === 'spinner') {
      if (e.leaving) {
        e.y -= 75 * dt;
        if (e.y < -50) e.dead = true;
      } else if (e.y < e.targetY - 2) {
        e.y += 52 * dt;
      } else {
        e.lifeT += dt;
        e.angle += 2.0 * dt;
        e.fireT -= dt;
        if (e.fireT <= 0) {
          ringShot(e, 10, 88 * waveSpeed, e.t * 0.8, C.green, 4);
          e.fireT = 1.55;
        }
        if (e.lifeT > 9) e.leaving = true;
      }

    } else if (e.type === 'darter') {
      e.y += e.vy * dt;
      e.x += e.vx * dt;
      if (e.y > H + 30 || e.x < -30 || e.x > W + 30) e.dead = true;
    }
  }
}

function updateBoss(e, dt) {
  e.hitFlash = Math.max(0, e.hitFlash - dt * 4);

  if (e.entering) {
    e.y += 85 * dt;
    if (e.y >= 112) { e.y = 112; e.entering = false; e.atkT = 0.7; }
    return;
  }

  const hpR = e.hp / e.maxHp;
  const ph = hpR > 0.66 ? 1 : hpR > 0.33 ? 2 : 3;
  if (ph !== e.phase) {
    e.phase = ph;
    e.atkT = 0.55;
    e.fanT = 1.2;
    G.flash = 0.5;
    G.shake = 12;
    clearBullets(false);
    Snd.boom(0.8);
  }

  const sp = ph === 3 ? 1.5 : ph === 2 ? 1.2 : 1;
  e.x = W / 2 + Math.sin(e.t * 0.55 * sp) * (W * 0.26);
  e.y = 112 + Math.sin(e.t * 1.35) * 9;

  e.atkT -= dt;
  if (e.atkT > 0) return;

  const bs = 1 + Math.min(0.35, G.wave * 0.015);
  if (ph === 1) {
    e.alt = !e.alt;
    if (e.alt) { aimedShot(e, 5, 0.16, 155 * bs, C.pink, 4.5); e.atkT = 1.2; }
    else { ringShot(e, 16, 105 * bs, e.t, C.cyan, 4.5); e.atkT = 1.2; }
  } else if (ph === 2) {
    e.spin += 0.44;
    for (let k = 0; k < 2; k++) ebullet(e.x, e.y + 10, e.spin + k * Math.PI, 118 * bs, 4.5, C.purple);
    e.atkT = 0.14;
    e.fanT -= 0.14;
    if (e.fanT <= 0) { aimedShot(e, 7, 0.13, 170 * bs, C.pink, 4.5); e.fanT = 2.5; }
  } else {
    e.spin += 0.50;
    for (let k = 0; k < 3; k++) ebullet(e.x, e.y + 10, e.spin + k * TAU / 3, 130 * bs, 4.5, C.magenta);
    e.atkT = 0.12;
    e.fanT -= 0.12;
    if (e.fanT <= 0) { aimedShot(e, 7, 0.12, 185 * bs, C.orange, 4.5); e.fanT = 2.1; }
  }
}

/* ============================================================
   9. 子弹 / 拾取物 / 粒子
   ============================================================ */
function updatePlayerBullets(dt) {
  for (const b of pb) {
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.y < -20 || b.x < -20 || b.x > W + 20) b.dead = true;
  }
}

function updateEnemyBullets(dt) {
  for (const b of eb) {
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.x < -24 || b.x > W + 24 || b.y < -30 || b.y > H + 24) b.dead = true;
  }
}

function updatePickups(dt) {
  const p = player;
  for (const u of pickups) {
    u.t += dt;
    const d2 = dist2(u.x, u.y, p.x, p.y);
    if (d2 < 90 * 90 && p.alive) {
      const d = Math.sqrt(d2) || 1;
      u.x += (p.x - u.x) / d * 230 * dt;
      u.y += (p.y - u.y) / d * 230 * dt;
    } else {
      u.y += 48 * dt;
      u.x += Math.sin(u.t * 2 + u.seed) * 18 * dt;
    }
    if (u.y > H + 20) u.dead = true;
  }
}

function updateParticles(dt) {
  for (const q of parts) {
    q.life -= dt;
    if (q.life <= 0) { q.dead = true; continue; }
    q.x += q.vx * dt;
    q.y += q.vy * dt;
    q.vx *= 0.965;
    q.vy *= 0.965;
    q.vy += 26 * dt;
  }
  for (const r of rings) {
    r.life -= dt;
    r.r += r.vr * dt;
    if (r.life <= 0) r.dead = true;
  }
  for (const t of texts) {
    t.life -= dt;
    t.y -= 26 * dt;
    if (t.life <= 0) t.dead = true;
  }
}

function sweep(arr) {
  for (let i = arr.length - 1; i >= 0; i--) if (arr[i].dead) arr.splice(i, 1);
}

/* ============================================================
   10. 碰撞
   ============================================================ */
function collide() {
  const p = player;
  if (!p.alive) return;

  // 玩家子弹 vs 敌人
  for (let i = 0; i < pb.length; i++) {
    const b = pb[i];
    if (b.dead) continue;
    for (let j = 0; j < enemies.length; j++) {
      const e = enemies[j];
      if (e.dead) continue;
      if (Math.abs(b.x - e.x) > e.r + 6 || Math.abs(b.y - e.y) > e.r + 10) continue;
      if (dist2(b.x, b.y, e.x, e.y) <= e.r * e.r) {
        b.dead = true;
        damageEnemy(e, b.dmg);
        spark(b.x, b.y, C.cyan, 2);
        break;
      }
    }
  }

  if (p.invuln > 0) return;

  // 敌机机体撞击
  for (const e of enemies) {
    if (e.dead) continue;
    const rr = p.r + e.r * 0.72;
    if (dist2(p.x, p.y, e.x, e.y) < rr * rr) { damageEnemy(e, 6); hitPlayer(); return; }
  }

  // 敌弹碰撞 + 擦弹
  for (const b of eb) {
    if (b.dead) continue;
    const d2 = dist2(p.x, p.y, b.x, b.y);
    const hitR = p.r + b.r * 0.72;
    if (d2 < hitR * hitR) { hitPlayer(); return; }
    if (!b.grazed) {
      const gr = hitR + 13;
      if (d2 < gr * gr) {
        b.grazed = true;
        G.graze++;
        G.score += 15;
        spark(p.x + rand(-6, 6), p.y + rand(-6, 6), C.cyan, 1, 0.25);
      }
    }
  }

  // 拾取物
  for (const u of pickups) {
    if (u.dead) continue;
    if (dist2(p.x, p.y, u.x, u.y) < 16 * 16) { collectPickup(u); }
  }
}

function damageEnemy(e, dmg) {
  e.hp -= dmg;
  e.hitFlash = Math.min(1, e.hitFlash + 0.55);
  if (e.hp <= 0 && !e.dead) killEnemy(e);
  else if (e.type !== 'boss') Snd.hit();
}

function killEnemy(e) {
  if (e.type === 'boss') { bossDefeated(e); return; }
  e.dead = true;
  G.kills++;
  G.score += e.score;
  addText(e.x, e.y - 6, '+' + e.score, C.yellow);
  explode(e.x, e.y, C.pink, 14);
  Snd.boom(0.55);
  G.shake = Math.max(G.shake, 3.5);
  maybeDrop(e);
}

function bossDefeated(e) {
  e.dead = true;
  G.boss = null;
  G.kills++;
  G.score += e.score;
  G.banner = 'BOSS DOWN';
  G.bannerT = 2.2;
  G.flash = 0.75;
  G.shake = 20;
  Snd.bigBoom();
  clearBullets(true);
  for (let i = 0; i < 12; i++) {
    timers.push({
      t: i * 0.09, fn: () => {
        explode(e.x + rand(-46, 46), e.y + rand(-26, 26), i % 2 ? C.yellow : C.pink, 12);
        G.shake = Math.max(G.shake, 8);
      },
    });
  }
  timers.push({ t: 0.9, fn: () => { explode(e.x, e.y, C.white, 40); Snd.bigBoom(); } });
  for (let i = 0; i < 3; i++) spawnPickup(e.x + rand(-52, 52), e.y + rand(-10, 20), 'power');
  spawnPickup(e.x, e.y + 16, 'bomb');
  spawnPickup(e.x + 34, e.y + 12, 'life');
}

function clearBullets(score) {
  for (const b of eb) {
    if (b.dead) continue;
    b.dead = true;
    if (score) { G.score += 10; spark(b.x, b.y, C.yellow, 1); }
  }
}

function clearBulletsNear(x, y, rad) {
  for (const b of eb) {
    if (b.dead) continue;
    if (dist2(b.x, b.y, x, y) < rad * rad) { b.dead = true; spark(b.x, b.y, C.cyan, 1); }
  }
}

function hitPlayer() {
  const p = player;
  if (!p.alive || p.invuln > 0 || G.state !== 'playing') return;
  G.lives--;
  G.power = Math.max(1, G.power - 1);
  G.shake = 15;
  G.flash = 0.45;
  Snd.hurt();
  explode(p.x, p.y, C.cyan, 26);
  clearBulletsNear(p.x, p.y, 120);
  addText(p.x, p.y - 20, 'HIT', C.red);
  if (G.lives <= 0) {
    p.alive = false;
    explode(p.x, p.y, C.white, 34);
    gameOver();
  } else {
    p.invuln = 2.6;
    p.x = W / 2;
    p.y = H - 80;
  }
}

/* ============================================================
   11. 拾取物
   ============================================================ */
const PICK_TYPES = {
  power: { col: C.cyan, ch: 'P', label: 'POWER UP' },
  bomb:  { col: C.yellow, ch: 'B', label: 'BOMB +1' },
  life:  { col: C.pink, ch: '1', label: '1UP' },
  score: { col: C.green, ch: 'S', label: '+500' },
};

function spawnPickup(x, y, type) {
  pickups.push({ x, y, type, t: 0, seed: rand(TAU), dead: false });
}
function maybeDrop(e) {
  const chance = { drone: 0.10, gunner: 0.55, spinner: 0.60, darter: 0.06 }[e.type] || 0;
  if (Math.random() > chance) return;
  const roll = Math.random();
  let type = 'power';
  if (roll > 0.97) type = 'life';
  else if (roll > 0.85) type = 'score';
  else if (roll > 0.62) type = 'bomb';
  spawnPickup(e.x, e.y, type);
}
function collectPickup(u) {
  u.dead = true;
  const d = PICK_TYPES[u.type];
  Snd.pickup();
  addText(u.x, u.y - 10, d.label, d.col);
  if (u.type === 'power') {
    if (G.power < 4) { G.power++; G.score += 100; }
    else G.score += 500;
  } else if (u.type === 'bomb') {
    G.bombs = Math.min(5, G.bombs + 1);
  } else if (u.type === 'life') {
    G.lives = Math.min(5, G.lives + 1);
  } else {
    G.score += 500;
  }
  spark(u.x, u.y, d.col, 6);
}

function useBomb() {
  if (G.state !== 'playing' || G.bombs <= 0 || !player.alive) return;
  G.bombs--;
  G.flash = 0.65;
  G.shake = 18;
  Snd.bomb();
  rings.push({ x: player.x, y: player.y, r: 12, vr: 620, life: 0.55, max: 0.55, col: C.cyan });
  rings.push({ x: player.x, y: player.y, r: 4, vr: 420, life: 0.7, max: 0.7, col: C.white });
  for (const b of eb) {
    if (b.dead) continue;
    b.dead = true;
    G.score += 5;
    spark(b.x, b.y, C.yellow, 2);
  }
  for (const e of enemies) if (!e.dead) damageEnemy(e, 46);
  player.invuln = Math.max(player.invuln, 1.8);
}

/* ============================================================
   12. 特效
   ============================================================ */
function spark(x, y, col, n, life) {
  for (let i = 0; i < n; i++) {
    parts.push({
      x, y, vx: rand(-70, 70), vy: rand(-70, 70),
      life: life || rand(0.2, 0.4), max: 0.4,
      size: rand(1, 2.5), col, dead: false,
    });
  }
}
function explode(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    const a = rand(TAU), s = rand(40, 230);
    parts.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rand(0.35, 0.85), max: 0.85,
      size: rand(1.5, 4), col: Math.random() < 0.3 ? C.white : col, dead: false,
    });
  }
  rings.push({ x, y, r: 4, vr: 190, life: 0.35, max: 0.35, col });
}
function addText(x, y, str, col) {
  texts.push({ x, y, str, col, life: 0.9, dead: false });
}

/* ============================================================
   13. 主更新
   ============================================================ */
function update(dt) {
  G.time += dt;
  G.overT += dt;

  // 星空
  for (const s of stars) {
    s.y += (16 + s.z * 120) * dt;
    if (s.y > H + 4) { s.y = -4; s.x = rand(W); }
  }
  for (const b of blobs) {
    b.y += b.sp * dt;
    if (b.y - b.r > H) { b.y = -b.r; b.x = rand(W); }
  }

  if (G.state === 'playing') {
    updatePlayer(dt);
    updateWaves(dt);
    updateEnemies(dt);
    updatePlayerBullets(dt);
    updateEnemyBullets(dt);
    updatePickups(dt);
    collide();
    sweep(pb); sweep(eb); sweep(enemies); sweep(pickups);
  }

  updateParticles(dt);
  sweep(parts); sweep(rings); sweep(texts);

  for (let i = timers.length - 1; i >= 0; i--) {
    timers[i].t -= dt;
    if (timers[i].t <= 0) { const fn = timers[i].fn; timers.splice(i, 1); fn(); }
  }

  G.bannerT = Math.max(0, G.bannerT - dt);
  G.shake *= Math.pow(0.001, dt);
  if (G.shake < 0.2) G.shake = 0;
  G.flash = Math.max(0, G.flash - dt * 2.2);
}

function updateWaves(dt) {
  for (let i = spawnQueue.length - 1; i >= 0; i--) {
    const s = spawnQueue[i];
    s.t -= dt;
    if (s.t <= 0) { const fn = s.fn; spawnQueue.splice(i, 1); fn(); }
  }

  if (G.waveState === 'idle') {
    G.waveTimer -= dt;
    if (G.waveTimer <= 0) startWave();
  } else if (G.waveState === 'spawning') {
    G.grace = Math.max(0, G.grace - dt);
    G.waveElapsed += dt;
    // 保险：单波拖太久就让残存敌机撤退，避免卡关
    if (G.waveElapsed > 30) {
      for (const e of enemies) if (e.type !== 'boss') e.leaving = true;
    }
    if (G.grace <= 0 && spawnQueue.length === 0 && enemies.length === 0 && !G.boss) {
      G.waveState = 'clearing';
      G.waveTimer = 0.9;
      const bonus = 150 * G.wave;
      G.score += bonus;
      addText(W / 2, H * 0.45, 'WAVE CLEAR +' + bonus, C.cyan);
      if (G.wave % 3 === 0) spawnPickup(W / 2, H * 0.4, 'power');
    }
  } else if (G.waveState === 'clearing') {
    G.waveTimer -= dt;
    if (G.waveTimer <= 0) { G.waveState = 'idle'; G.waveTimer = 1.0; }
  }
}

/* ============================================================
   14. 渲染
   ============================================================ */
const bulletCache = new Map();
function bulletSprite(col, r) {
  const key = col + '|' + r;
  const cached = bulletCache.get(key);
  if (cached) return cached;
  const size = Math.ceil(r * 6);
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const cc = size / 2;
  const grd = g.createRadialGradient(cc, cc, 0, cc, cc, size / 2);
  grd.addColorStop(0, col);
  grd.addColorStop(0.30, col);
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.globalAlpha = 0.55;
  g.fillStyle = grd;
  g.beginPath(); g.arc(cc, cc, size / 2, 0, TAU); g.fill();
  g.globalAlpha = 1;
  g.fillStyle = col;
  g.beginPath(); g.arc(cc, cc, r, 0, TAU); g.fill();
  g.fillStyle = '#ffffff';
  g.beginPath(); g.arc(cc - r * 0.2, cc - r * 0.2, r * 0.40, 0, TAU); g.fill();
  const s = { img: c, size };
  bulletCache.set(key, s);
  return s;
}

function txt(str, x, y, size, color, align, alpha) {
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.fillStyle = color;
  ctx.font = '700 ' + size + 'px Consolas, "Courier New", ui-monospace, monospace';
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'top';
  ctx.fillText(str, x, y);
  ctx.globalAlpha = 1;
}
function cn(str, x, y, size, color, align, alpha) {
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.fillStyle = color;
  ctx.font = '500 ' + size + 'px "Microsoft YaHei", "PingFang SC", system-ui, sans-serif';
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'top';
  ctx.fillText(str, x, y);
  ctx.globalAlpha = 1;
}

function drawStars() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const s of stars) {
    const a = 0.25 + s.z * 0.55;
    ctx.globalAlpha = a * (0.7 + 0.3 * Math.sin(G.time * 2 + s.tw));
    ctx.fillStyle = s.z > 0.8 ? '#bfeaff' : s.z > 0.5 ? '#7fb8d8' : '#3f6f8f';
    ctx.fillRect(s.x | 0, s.y | 0, s.s, s.s + (s.z > 0.8 ? 1 : 0));
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawPlayer() {
  const p = player;
  if (!p.alive) return;
  const blink = p.invuln > 0 && Math.floor(G.time * 20) % 2 === 0;
  ctx.save();
  ctx.translate(Math.round(p.x), Math.round(p.y));
  ctx.rotate(p.tilt * 0.22);

  const fl = 5 + Math.sin(G.time * 42) * 2.5;
  ctx.globalCompositeOperation = 'lighter';
  const eg = ctx.createRadialGradient(0, 13, 1, 0, 13, 14);
  eg.addColorStop(0, 'rgba(120,230,255,.45)');
  eg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = eg;
  ctx.beginPath(); ctx.arc(0, 13, 14, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(90,215,255,.60)';
  ctx.beginPath(); ctx.moveTo(-4, 10); ctx.lineTo(0, 10 + fl + 4); ctx.lineTo(4, 10); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,210,140,.60)';
  ctx.beginPath(); ctx.moveTo(-2, 10); ctx.lineTo(0, 10 + fl); ctx.lineTo(2, 10); ctx.closePath(); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  ctx.globalAlpha = blink ? 0.5 : 1;
  ctx.drawImage(SPR.player.img, -SPR.player.w / 2, -SPR.player.h / 2);
  ctx.globalAlpha = 1;

  if (p.focus) {
    ctx.strokeStyle = 'rgba(255,255,255,.85)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, 6, 0, TAU); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(0, 0, 2, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawBossBody(e) {
  const flash = clamp(e.hitFlash, 0, 1);
  const ph = e.phase || 1;
  const coreCol = ph === 1 ? '#5ef0ff' : ph === 2 ? '#b06bff' : '#ff2d78';
  const white = flash > 0.35;

  ctx.save();
  ctx.translate(Math.round(e.x), Math.round(e.y));

  // 光晕
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(0, 0, 8, 0, 0, 82);
  g.addColorStop(0, ph === 3 ? 'rgba(255,45,120,.26)' : 'rgba(170,90,255,.22)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, 82, 0, TAU); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  const hull = white ? '#ffffff' : '#3c1133';
  const plate = white ? '#ffffff' : '#b32066';
  const trim = white ? '#ffffff' : '#ff7cc0';

  // 亮边轮廓（先画大 2px 的底色块）
  ctx.fillStyle = trim;
  ctx.fillRect(-46, -18, 92, 36);
  ctx.fillRect(-36, -32, 72, 18);
  ctx.fillRect(-22, -40, 44, 10);
  ctx.fillRect(-58, -2, 16, 22);
  ctx.fillRect(42, -2, 16, 22);

  // 主体（阶梯状，像素感）
  ctx.fillStyle = hull;
  ctx.fillRect(-44, -16, 88, 32);
  ctx.fillRect(-34, -30, 68, 16);
  ctx.fillRect(-20, -38, 40, 10);
  ctx.fillRect(-56, 0, 14, 18);
  ctx.fillRect(42, 0, 14, 18);

  // 装甲带
  ctx.fillStyle = plate;
  ctx.fillRect(-38, -12, 76, 5);
  ctx.fillRect(-30, 4, 60, 4);
  ctx.fillRect(-44, -16, 6, 20);
  ctx.fillRect(38, -16, 6, 20);
  ctx.fillRect(-56, 0, 14, 3);
  ctx.fillRect(42, 0, 14, 3);

  // 炮塔
  ctx.fillStyle = plate;
  ctx.fillRect(-24, 16, 10, 13);
  ctx.fillRect(14, 16, 10, 13);
  ctx.fillStyle = coreCol;
  ctx.fillRect(-22, 27, 6, 3);
  ctx.fillRect(16, 27, 6, 3);

  // 舰桥灯
  ctx.fillStyle = white ? '#ffffff' : '#ffe066';
  ctx.fillRect(-14, -26, 7, 3);
  ctx.fillRect(7, -26, 7, 3);

  // 核心
  const pulse = 0.8 + 0.20 * Math.sin(G.time * 6);
  ctx.globalCompositeOperation = 'lighter';
  const cg = ctx.createRadialGradient(0, -6, 1, 0, -6, 24 * pulse);
  cg.addColorStop(0, '#ffffff');
  cg.addColorStop(0.30, coreCol);
  cg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.arc(0, -6, 24 * pulse, 0, TAU); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  ctx.restore();
}

function drawEnemies() {
  for (const e of enemies) {
    if (e.dead) continue;
    if (e.type === 'boss') { drawBossBody(e); continue; }
    const spr = SPR[e.spr];
    if (!spr) continue;
    ctx.save();
    ctx.translate(Math.round(e.x), Math.round(e.y));
    if (e.type === 'spinner') ctx.rotate(e.angle || 0);
    if (e.hitFlash > 0.02) {
      ctx.globalAlpha = clamp(e.hitFlash, 0, 1) * 0.9;
      ctx.drawImage(spr.white, -spr.w / 2, -spr.h / 2);
      ctx.globalAlpha = 1;
    }
    ctx.drawImage(spr.img, -spr.w / 2, -spr.h / 2);
    ctx.restore();
  }
}

function drawPlayerBullets() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const b of pb) {
    ctx.fillStyle = 'rgba(70,200,255,.28)';
    ctx.fillRect(b.x - 3, b.y - 12, 6, 18);
    ctx.fillStyle = 'rgba(150,240,255,.90)';
    ctx.fillRect(b.x - 1, b.y - 11, 2, 15);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(b.x, b.y - 9, 1, 9);
  }
  ctx.restore();
}

function drawEnemyBullets() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const b of eb) {
    const s = bulletSprite(b.col, b.r);
    ctx.drawImage(s.img, b.x - s.size / 2, b.y - s.size / 2, s.size, s.size);
  }
  ctx.restore();
}

function drawPickups() {
  for (const u of pickups) {
    const d = PICK_TYPES[u.type];
    const pulse = 1 + Math.sin(G.time * 6 + u.seed) * 0.12;
    ctx.save();
    ctx.translate(u.x, u.y);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.30;
    ctx.fillStyle = d.col;
    ctx.beginPath(); ctx.arc(0, 0, 11 * pulse, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#070b14';
    ctx.fillRect(-6, -6, 12, 12);
    ctx.strokeStyle = d.col;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(-6.5, -6.5, 13, 13);
    ctx.restore();
    txt(d.ch, u.x, u.y - 5, 9, d.col, 'center');
  }
}

function drawParticles() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const q of parts) {
    const a = clamp(q.life / q.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = q.col;
    const s = Math.max(1, q.size * a);
    ctx.fillRect(q.x - s / 2, q.y - s / 2, s, s);
  }
  ctx.restore();
}

function drawRings() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const r of rings) {
    const a = clamp(r.life / r.max, 0, 1);
    ctx.globalAlpha = a * 0.8;
    ctx.strokeStyle = r.col;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

function drawTexts() {
  for (const t of texts) {
    const a = clamp(t.life / 0.9, 0, 1);
    txt(t.str, t.x, t.y, 8, t.col, 'center', a);
  }
}

function drawHUD() {
  if (G.state === 'title') return;

  ctx.fillStyle = 'rgba(3,6,14,0.86)';
  ctx.fillRect(0, 0, W, 32);
  ctx.fillStyle = 'rgba(90,220,255,0.26)';
  ctx.fillRect(0, 32, W, 1);
  ctx.fillStyle = 'rgba(90,220,255,0.05)';
  ctx.fillRect(0, 0, W, 10);

  txt('SCORE', 8, 4, 7, '#7fd4f0');
  txt(fmt(G.score, 6), 8, 13, 13, '#ffffff');
  txt('WAVE ' + fmt(G.wave, 2), W - 8, 4, 7, '#7fd4f0', 'right');
  txt('GRAZE ' + G.graze, W - 8, 16, 8, '#8fd6ff', 'right');

  // BOSS 血条
  if (G.boss && !G.boss.dead) {
    const bx = 24, bw = W - 48, by = 40;
    ctx.fillStyle = 'rgba(0,0,0,.7)';
    ctx.fillRect(bx - 1, by - 1, bw + 2, 6);
    const ratio = clamp(G.boss.hp / G.boss.maxHp, 0, 1);
    const grad = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    grad.addColorStop(0, '#ff2d78');
    grad.addColorStop(0.5, '#ff6fb0');
    grad.addColorStop(1, '#ffd166');
    ctx.fillStyle = grad;
    ctx.fillRect(bx, by, bw * ratio, 4);
    txt('OVERSEER', bx, by + 8, 7, '#ff9bc8');
  }

  // 底栏
  ctx.fillStyle = 'rgba(3,6,14,0.86)';
  ctx.fillRect(0, H - 26, W, 26);
  ctx.fillStyle = 'rgba(90,220,255,0.20)';
  ctx.fillRect(0, H - 26, W, 1);

  ctx.save();
  ctx.translate(15, H - 13);
  ctx.rotate(Math.PI / 4);
  ctx.fillStyle = C.cyan;
  ctx.fillRect(-3, -3, 6, 6);
  ctx.restore();
  txt('x' + G.lives, 24, H - 20, 10, '#dffaff');

  ctx.save();
  ctx.translate(W - 15, H - 13);
  ctx.rotate(Math.PI / 4);
  ctx.strokeStyle = C.yellow;
  ctx.lineWidth = 1.4;
  ctx.strokeRect(-3.2, -3.2, 6.4, 6.4);
  ctx.restore();
  txt('x' + G.bombs, W - 34, H - 20, 10, '#ffe9a8', 'right');

  txt('PWR', W / 2 - 26, H - 20, 7, '#7fd4f0');
  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = i < G.power ? C.cyan : 'rgba(90,150,180,.25)';
    ctx.fillRect(W / 2 - 8 + i * 7, H - 18, 5, 4);
  }

  if (isTouch) {
    // 暂停按钮
    ctx.fillStyle = 'rgba(90,220,255,.16)';
    ctx.fillRect(W / 2 - 15, 8, 30, 16);
    txt('II', W / 2, 9, 10, '#9fe4ff', 'center');
    // 炸弹按钮
    ctx.save();
    ctx.globalAlpha = G.bombs > 0 ? 0.9 : 0.3;
    ctx.fillStyle = 'rgba(255,224,102,.12)';
    ctx.beginPath(); ctx.arc(BOMB_BTN.x, BOMB_BTN.y, BOMB_BTN.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = C.yellow;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(BOMB_BTN.x, BOMB_BTN.y, BOMB_BTN.r, 0, TAU); ctx.stroke();
    txt('BOMB', BOMB_BTN.x, BOMB_BTN.y - 10, 8, C.yellow, 'center');
    txt('x' + G.bombs, BOMB_BTN.x, BOMB_BTN.y + 1, 9, '#ffe9a8', 'center');
    ctx.restore();
  }
}

function drawBanner() {
  if (G.bannerT <= 0 || !G.banner) return;
  const a = clamp(G.bannerT, 0, 1);
  const y = G.banner === '!! WARNING !!' ? 210 : 150;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  if (G.banner === '!! WARNING !!') {
    const blink = Math.floor(G.time * 8) % 2 === 0;
    ctx.font = '700 20px Consolas, "Courier New", monospace';
    ctx.shadowColor = '#ff2d78';
    ctx.shadowBlur = 18;
    ctx.fillStyle = blink ? '#ff3d6e' : '#ffb3c8';
    ctx.fillText(G.banner, W / 2, y);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,45,120,.35)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 6; i++) {
      const yy = y - 16 + i * 7;
      ctx.beginPath(); ctx.moveTo(20, yy); ctx.lineTo(W - 20, yy); ctx.stroke();
    }
  } else {
    ctx.font = '700 16px Consolas, "Courier New", monospace';
    ctx.shadowColor = '#38e8ff';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#bff4ff';
    ctx.fillText(G.banner, W / 2, y);
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

function drawFrame() {
  const m = 6, len = 20;
  ctx.strokeStyle = 'rgba(90,220,255,.40)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(m, m + len); ctx.lineTo(m, m); ctx.lineTo(m + len, m);
  ctx.moveTo(W - m - len, m); ctx.lineTo(W - m, m); ctx.lineTo(W - m, m + len);
  ctx.moveTo(m, H - m - len); ctx.lineTo(m, H - m); ctx.lineTo(m + len, H - m);
  ctx.moveTo(W - m - len, H - m); ctx.lineTo(W - m, H - m); ctx.lineTo(W - m, H - m - len);
  ctx.stroke();
}

function drawTitle() {
  const t = G.time;
  ctx.fillStyle = 'rgba(3,5,12,0.55)';
  ctx.fillRect(0, 0, W, H);

  // 标题
  const glitch = Math.sin(t * 1.7) > 0.96 ? rand(-3, 3) : 0;
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = '700 52px Consolas, "Courier New", monospace';
  ctx.shadowColor = '#2ee6ff';
  ctx.shadowBlur = 26;
  ctx.fillStyle = '#e6fdff';
  ctx.fillText('NEON', W / 2 + glitch, 118);
  ctx.shadowColor = '#ff2d78';
  ctx.fillStyle = '#ffe3f1';
  ctx.fillText('VOID', W / 2 - glitch, 172);
  ctx.shadowBlur = 0;
  ctx.restore();

  cn('★  星 海 弹 幕  ★', W / 2, 238, 13, '#7fe6ff', 'center', 0.92);

  ctx.strokeStyle = 'rgba(90,220,255,.28)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(60, 270); ctx.lineTo(W - 60, 270); ctx.stroke();

  const blink = 0.55 + 0.45 * Math.sin(t * 4);
  cn('按 ENTER 或 点击屏幕 开始', W / 2, 290, 14, '#ffffff', 'center', blink);

  const lines = [
    ['移动', '方向键 / WASD  ·  触屏拖动'],
    ['精准', 'SHIFT 慢速移动（显示判定点）'],
    ['炸弹', 'X 清除弹幕  ·  无敌 1.8 秒'],
    ['暂停', 'P / ESC  ·  静音 M'],
  ];
  let y = 350;
  for (const l of lines) {
    cn(l[0], 66, y, 10, '#5fb4d8');
    cn(l[1], 106, y, 10, '#b9d8e8');
    y += 26;
  }

  ctx.strokeStyle = 'rgba(90,220,255,.18)';
  ctx.beginPath(); ctx.moveTo(60, 462); ctx.lineTo(W - 60, 462); ctx.stroke();
  txt('BEST  ' + fmt(G.best, 6), W / 2, 478, 11, '#ffd166', 'center');
  cn('自动射击 · 擦弹得分 · 每 5 波 BOSS', W / 2, 506, 9, '#5f8fa8', 'center');

  // 标题页装饰飞船
  const sx = W / 2 + Math.sin(t * 0.8) * 70;
  const sy = 590 + Math.sin(t * 1.6) * 6;
  ctx.save();
  ctx.translate(sx, sy);
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(80,210,255,.45)';
  ctx.beginPath(); ctx.moveTo(-4, 12); ctx.lineTo(0, 26); ctx.lineTo(4, 12); ctx.closePath(); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(SPR.player.img, -SPR.player.w / 2, -SPR.player.h / 2);
  ctx.restore();

  cn('单文件 · 无外部资源 · 纯 Canvas', W / 2, 614, 8, '#3f667a', 'center');
  drawFrame();
}

function drawGameOver() {
  const a = clamp(G.overT * 1.6, 0, 0.72);
  ctx.fillStyle = 'rgba(4,2,8,' + a + ')';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = '700 36px Consolas, "Courier New", monospace';
  ctx.shadowColor = '#ff2d78';
  ctx.shadowBlur = 22;
  ctx.fillStyle = '#ffd0de';
  ctx.fillText('GAME OVER', W / 2, 200);
  ctx.restore();

  txt('SCORE  ' + fmt(G.score, 6), W / 2, 268, 14, '#dffaff', 'center');
  txt('BEST   ' + fmt(G.best, 6), W / 2, 294, 11, '#ffd166', 'center');
  if (G.newBest) {
    const blink = 0.5 + 0.5 * Math.sin(G.time * 6);
    cn('★ 新纪录 ★', W / 2, 320, 12, '#ffd166', 'center', blink);
  }
  txt('到达 WAVE ' + fmt(G.wave, 2) + '   ·   击破 ' + G.kills, W / 2, 352, 9, '#7fb8d8', 'center');

  if (G.overT > 0.8) {
    const blink = 0.5 + 0.5 * Math.sin(G.time * 4);
    cn('按 ENTER 重新开始', W / 2, 428, 14, '#ffffff', 'center', blink);
  }
  drawFrame();
}

function drawPaused() {
  ctx.fillStyle = 'rgba(4,6,14,0.66)';
  ctx.fillRect(0, 0, W, H);
  txt('PAUSED', W / 2, 270, 28, '#bff4ff', 'center');
  cn('按 P / ESC 继续 · 按 M 静音', W / 2, 316, 10, '#7fb8d8', 'center');
}

function render() {
  ctx.setTransform(R, 0, 0, R, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  // 背景
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#070b1a');
  bg.addColorStop(0.55, '#05070f');
  bg.addColorStop(1, '#0a0614');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // 背景星云
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const b of blobs) ctx.drawImage(b.img, b.x - b.r, b.y - b.r);
  ctx.restore();

  ctx.save();
  if (G.shake > 0) {
    ctx.translate(rand(-G.shake, G.shake), rand(-G.shake, G.shake));
  }

  drawStars();
  if (G.state !== 'title') {
    drawPickups();
    drawEnemies();
    drawPlayerBullets();
    drawPlayer();
    drawEnemyBullets();
    drawParticles();
    drawRings();
    drawTexts();
  }

  ctx.restore();

  if (G.state !== 'title') {
    drawHUD();
    drawBanner();
  }

  if (G.state === 'title') drawTitle();
  else if (G.state === 'paused') drawPaused();
  else if (G.state === 'gameover') drawGameOver();

  if (G.flash > 0) {
    ctx.fillStyle = 'rgba(220,245,255,' + (G.flash * 0.5) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  // 暗角
  const vig = ctx.createRadialGradient(W / 2, H / 2, H * 0.32, W / 2, H / 2, H * 0.72);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);
}

/* ============================================================
   15. 主循环
   ============================================================ */
const DEMO = qs.has('demo') ? Math.max(0, parseFloat(qs.get('demo') || '6')) : 0;

function layout() {
  const s = Math.min((window.innerWidth - 12) / W, (window.innerHeight - 12) / H);
  stage.style.width = Math.floor(W * s) + 'px';
  stage.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', layout);
layout();

let last = performance.now();
let acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000;
  last = now;
  if (!isFinite(dt) || dt <= 0) dt = STEP;
  if (dt > 0.2) dt = 0.2;
  acc += dt;
  let steps = 0;
  while (acc >= STEP && steps < 5) {
    update(STEP);
    acc -= STEP;
    steps++;
  }
  if (steps === 5) acc = 0;
  render();
}

// 调试 / 截图模式（正常游玩不受影响）
//   ?demo=秒数  快速模拟若干秒后截图
//   ?boss=1     直接进入 BOSS 战
//   ?shot=1     画布固定为 360x640（截图用）
//   ?hold=1     固定飞机位置（截图用）
if (qs.has('shot')) {
  window.removeEventListener('resize', layout);
  stage.style.position = 'fixed';
  stage.style.left = '0px';
  stage.style.top = '0px';
  stage.style.width = '360px';
  stage.style.height = '640px';
}
if (DEMO) {
  startGame();
  player.invuln = 99999;
  if (qs.has('boss')) { G.wave = 4; G.waveState = 'idle'; G.waveTimer = 0.05; }
  if (qs.get('wave')) {
    G.wave = parseInt(qs.get('wave'), 10) - 1;
    G.waveState = 'idle'; G.waveTimer = 0.05;
  }
  const steps = Math.min(9000, Math.round(DEMO * 60));
  for (let i = 0; i < steps; i++) update(STEP);
  if (qs.has('over')) {
    G.score = 12450; G.wave = 7; G.kills = 96;
    G.best = Math.max(G.best, 9800);
    gameOver();
  }
}

window.addEventListener('error', function (ev) {
  document.title = 'ERR: ' + (ev.message || 'unknown');
});

// 供调试/自动化测试使用
window.__NV = { G, player, enemies, eb, pb, pickups, parts, startGame };

requestAnimationFrame(frame);
})();
</script>
